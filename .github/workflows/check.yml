name: Check aiDiary
on:
  push:
    branches: [main, 'build/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test inputs, export and SQLite schema
        run: npm test
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Check Sites deployment artifacts
        run: |
          test -f dist/.openai/hosting.json
          test -f dist/.openai/drizzle/0000_initial.sql
