name: Public release secret audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/public-release-secret-audit.yml"
      - "scripts/audit-git-history.py"

permissions:
  contents: read

jobs:
  history-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history (redacted heuristic)
        run: python3 scripts/audit-git-history.py
      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Full Gitleaks scan (redacted, no report artifact)
        run: |
          gitleaks git --redact --exit-code 1 --log-opts="--all" --verbose=false .
