name: Public release secret audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/public-release-secret-audit.yml"
      - "scripts/audit-git-history.py"

permissions:
  contents: read

jobs:
  history-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan entire Git history (redacted output)
        run: python3 scripts/audit-git-history.py
